<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 3 – Weather App (React, no build)</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- React via CDN for a beginner, plus Babel for JSX in the browser -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <main class="container">
    <h1>Weather</h1>
    <div id="root"></div>
  </main>

  <!-- Inline JSON so you can open the file directly without a local server -->
  <script type="application/json" id="weather-data">
    {
      "location": { "city": "Bristol", "country": "UK" },
      "current": { "temp_c": 12, "condition": "Partly cloudy", "humidity": 67, "wind_kph": 15 },
      "forecast": [
        { "day": "Sat", "max": 13, "min": 7, "text": "Cloudy" },
        { "day": "Sun", "max": 14, "min": 8, "text": "Light rain" },
        { "day": "Mon", "max": 12, "min": 6, "text": "Sunny intervals" }
      ]
    }
  </script>

  <!-- Your app code -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
